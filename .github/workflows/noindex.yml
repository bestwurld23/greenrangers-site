name: Remove noindex tags
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  noindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip robots meta tag
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          sed -i 's|<meta name="robots" content="noindex,nofollow,noarchive">||' *.html
          grep -c noindex *.html || true
      - name: Commit and push
        run: |
          git config user.name "bestwurld23"
          git config user.email "bestwurld23@users.noreply.github.com"
          git add -A
          git commit -m "Remove noindex robots meta so the site can be indexed" || echo nothing-to-commit
          git push
